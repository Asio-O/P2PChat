# ── 人工评审检查项（代替配对门禁；本仓库无配对门禁脚本） ──────────────
#
# 1. **有意偏离：两份语言文件的正文逐字相同。**
#    正常配对的约定是「中文为记录本体、英文镜像其结构」。本 Note **不满足**该形状：
#    `.md` 与 `.zh.md` 的正文**都是中文且逐字相同**。
#    理由：这是一份**冻结的归档制品**，按归档规则**永不修改**。
#    翻译会引入两份一旦出错就**永远无法修正**的副本 —— 对归档来说，
#    **逐字保真比双语对称更重要**。可翻译的决策记录请写在 `implemented/` / `proposed/`。
#    评审确认点：两文件 SHA256 必须相同（归档时记录，见归档提交）。
#
# 2. 本 Note **不是 ADR 骨架**：它没有 `## Problem` / `## Decision` /
#    `## Alternatives considered` / `## Consequences`，而是原工作文档的
#    中文小节名（见上方 `sections`）。归档路径 `archived/{class}/…` 沿用了
#    `process` 这一 class，但**内容形态仍是工作文档而非决策记录**。
#    若日后有门禁强制 ADR 骨架，本归档件会因这一条被拒 —— 这是**已知且有意**的。
#
# 3. **不要**校验本 Note 的**出站**链接：文件内部大量 `[REPAIR-PLAN.md](REPAIR-PLAN.md)`
#    形式的相对链接，在两个文件被移进同一目录后已不再解析。归档规则明令**永不**修复出站链接。
#
# 4. 本文件内含**大量已过期的门禁数字**（§3 表格、§3.1 冻结快照、任务板、源码行号）。
#    这是冻结归档的固有属性；头部警示段已明令「请勿从本文件引用任何数字」。
